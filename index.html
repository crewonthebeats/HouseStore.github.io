<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Reel de Facebook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #00acee;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
    }
    a {
      color: #00acee;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎬 Mi Reel de Facebook</h1>

  <!-- SDK de Facebook -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/es_ES/sdk.js#xfbml=1&version=v15.0">
  </script>

  <div class="video-wrapper">
    <div class="fb-video"
         data-href="https://www.facebook.com/reel/840066031780081/"
         data-width="500"
         data-show-text="false"
         data-autoplay="false">
    </div>
  </div>

  <p>Si el video no se reproduce, puedes verlo directamente aquí:</p>
  <a href="https://www.facebook.com/reel/840066031780081/" target="_blank">
    👉 Ver reel en Facebook
  </a>
</body>
</html>
